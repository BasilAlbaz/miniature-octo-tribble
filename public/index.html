<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="نماء — مساحة مستقلة للتعلّم الطبي والمراجعة السريرية.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%232d6657'/%3E%3Ctext x='50%25' y='56%25' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif'%3E%D9%86%3C/text%3E%3C/svg%3E">
    <title>نماء | مساحة التعلّم الطبي</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#dashboard" aria-label="نماء">
          <span class="brand-mark" aria-hidden="true">ن</span>
          <span class="brand-copy"><strong>نماء</strong><small data-i18n="brandTagline">مساحة التعلّم الطبي</small></span>
        </a>
        <nav class="main-nav" aria-label="التنقل الرئيسي" id="main-nav"></nav>
        <div class="top-actions">
          <span class="demo-pill"><span class="status-dot"></span><span data-i18n="demoMode">نسخة تجريبية</span></span>
          <button class="icon-button language-button" id="language-toggle" type="button" aria-label="Switch language">EN</button>
          <button class="avatar-button" id="profile-shortcut" type="button" aria-label="الملف الشخصي">س</button>
        </div>
      </header>
      <main id="main-content" tabindex="-1"></main>
      <footer class="site-footer">
        <span data-i18n="footerNote">محتوى توضيحي أصلي — ليس بديلاً عن الإرشاد الطبي.</span>
        <span><span class="status-dot"></span><span data-i18n="localOnly">تُحفظ بيانات التجربة على هذا الجهاز</span></span>
      </footer>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close icon-button" id="modal-close" type="button" aria-label="Close">×</button>
        <div id="modal-content"></div>
      </section>
    </div>
  </body>
</html>
